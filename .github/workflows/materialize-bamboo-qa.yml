name: Materialize Bamboo-001 motion QA images

on:
  push:
    branches:
      - feat/bamboo-joint-qa
      - feat/bamboo-shoulder-pivot-calibration
    paths:
      - "scripts/qa_bamboo_motion.py"
      - ".github/workflows/materialize-bamboo-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<14"
      - name: Compose draft QA PNGs from original image part pixels
        run: python scripts/qa_bamboo_motion.py
      - name: Verify every image and source provenance
        run: python scripts/qa_bamboo_motion.py --verify
      - name: Version actual QA images (not final character art)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/qa/bamboo-001
          if git diff --cached --quiet; then
            echo "QA images already committed"
          else
            git commit -m "assets(#15): add calibrated shoulder true-PNG QA comparison, unapproved"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
