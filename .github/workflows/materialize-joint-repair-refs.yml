name: Materialize Bamboo shoulder hip reference PNGs
on:
  push:
    branches: [feat/joint-repair-inputs]
    paths:
      - "scripts/prepare_joint_repair_refs.py"
      - ".github/workflows/materialize-joint-repair-refs.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reference-crops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing library
        run: python -m pip install "Pillow>=11,<14"
      - name: Crop real Bamboo shoulder and hip image pixels
        run: python scripts/prepare_joint_repair_refs.py
      - name: Verify images and provenance
        run: python scripts/prepare_joint_repair_refs.py --verify
      - name: Commit source reference images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/repair-inputs/bamboo-001/
          if git diff --cached --quiet; then
            echo "Already versioned"
          else
            git commit -m "assets(#16): archive actual shoulder and hip source crop references"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
