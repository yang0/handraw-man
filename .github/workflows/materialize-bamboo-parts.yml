name: Materialize Bamboo-001 source PNG cuts
on:
  push:
    branches:
      - feat/bamboo-part-slicing
    paths:
      - "scripts/slice_bamboo_001.py"
      - ".github/workflows/materialize-bamboo-parts.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing dependency
        run: python -m pip install "Pillow>=11,<14"
      - name: Cut existing original PNG into six real draft PNGs
        run: python scripts/slice_bamboo_001.py
      - name: Verify actual output files and pixel-exact reconstruction
        run: python scripts/slice_bamboo_001.py --verify
      - name: Commit PNG cutouts to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/candidates/phase1-fullbody-2026-11-08/parts/bamboo-001
          if git diff --cached --quiet; then
            echo "Already materialized"
          else
            git commit -m "assets(#5): six pixel-sliced Bamboo-001 PNG parts and manifest"
            git push origin HEAD:feat/bamboo-part-slicing
          fi
