name: Character asset composer checks

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "index.html"
      - "cut-editor.html"
      - "candidates.html"
      - "shapes.html"
      - "assets/candidates/**"
      - "web/**"
      - "src/**"
      - "scripts/generate-ai-source.mjs"
      - "scripts/import-imagegen-source.mjs"
      - "scripts/verify_phase1_fullbody.mjs"
      - "tests/**"
      - "package.json"
      - ".github/workflows/composer.yml"
  pull_request:
    paths:
      - "index.html"
      - "cut-editor.html"
      - "candidates.html"
      - "shapes.html"
      - "assets/candidates/**"
      - "web/**"
      - "src/**"
      - "scripts/generate-ai-source.mjs"
      - "scripts/import-imagegen-source.mjs"
      - "scripts/verify_phase1_fullbody.mjs"
      - "tests/**"
      - "package.json"
      - ".github/workflows/composer.yml"

jobs:
  static-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Verify real image candidates
        run: npm run verify:candidates
      - name: Verify actual full-body PNG source and derivative
        run: npm run verify:phase1
