name: Character asset composer checks

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "index.html"
      - "cut-editor.html"
      - "candidates.html"
      - "shapes.html"
      - "bamboo-parts.html"
      - "assets/qa/bamboo-001/**"
      - "scripts/qa_bamboo_motion.py"
      - "scripts/slice_bamboo_001.py"
      - "assets/candidates/phase1-fullbody-2026-11-08/parts/**"
      - "assets/candidates/**"
      - "web/**"
      - "src/**"
      - "scripts/generate-ai-source.mjs"
      - "scripts/import-imagegen-source.mjs"
      - "scripts/verify_phase1_fullbody.mjs"
      - "tests/**"
      - "package.json"
      - ".github/workflows/composer.yml"
  pull_request:
    paths:
      - "index.html"
      - "cut-editor.html"
      - "candidates.html"
      - "shapes.html"
      - "bamboo-parts.html"
      - "assets/qa/bamboo-001/**"
      - "scripts/qa_bamboo_motion.py"
      - "scripts/slice_bamboo_001.py"
      - "assets/candidates/phase1-fullbody-2026-11-08/parts/**"
      - "assets/candidates/**"
      - "web/**"
      - "src/**"
      - "scripts/generate-ai-source.mjs"
      - "scripts/import-imagegen-source.mjs"
      - "scripts/verify_phase1_fullbody.mjs"
      - "tests/**"
      - "package.json"
      - ".github/workflows/composer.yml"

jobs:
  static-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing library
        run: python -m pip install "Pillow>=11,<14"
      - name: Validate committed real PNGs, hashes, and exact neutral-pose reconstruction
        run: python scripts/slice_bamboo_001.py --verify
      - name: Verify committed true-PNG articulation QA screenshots and safe margins
        run: python scripts/qa_bamboo_motion.py --verify
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Verify real image candidates
        run: npm run verify:candidates
      - name: Verify actual full-body PNG source and derivative
        run: npm run verify:phase1
